function applyUI(){const a=$('#asc'),w=100/S.m.cols;a.style.display=S.mode==='ascii'?'grid':'none';a.style.fontSize=(w/.6)+'vw';a.style.lineHeight=(w*2)+'vw';a.style.background=S.m.inv?'#fff':'#000';a.style.color=S.m.inv?'#000':'#eee';$('#grid').style.display=S.grid?'block':'none';$('#hist').style.display=S.hist?'flex':'none'}
/* ---- camera ---- */
async function start(){
  try{if(S.stream)S.stream.getTracks().forEach(t=>t.stop());
    S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:S.facing,width:{ideal:3840},height:{ideal:2160}},audio:false});
    vid.srcObject=S.stream;await vid.play();S.src=vid;S.track=S.stream.getVideoTracks()[0];$('#gate').hidden=true;renderZoom();$('#bMir').style.display=S.facing==='user'?'grid':'none';$('#bMir').classList.toggle('on',!!S.o.flip);
  }catch(e){$('#gate').hidden=false}
}
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{S.src=im;S.track=null;$('#gate').hidden=true};im.src=URL.createObjectURL(f)};
const caps=()=>S.track&&S.track.getCapabilities?S.track.getCapabilities():{};
function renderZoom(){const z=caps().zoom;$('#zoom').innerHTML=z?[1,2,4].filter(v=>v>=z.min&&v<=z.max).map(v=>`<button class="b ${S.zoom===v?'on':''}" data-z="${v}">${v}x</button>`).join(''):''}
$('#zoom').onclick=e=>{const v=+e.target.dataset.z;if(v){S.zoom=v;setHw('zoom',v);renderZoom()}};
async function setHw(k,v){const a={[k]:+v};if(k==='iso'||k==='exposureTime')a.exposureMode='manual';if(k==='focusDistance')a.focusMode='manual';if(k==='colorTemperature')a.whiteBalanceMode='manual';try{await S.track.applyConstraints({advanced:[a]})}catch(e){}}
$('#bFlip').innerHTML=ic('flip');$('#bFmt').innerHTML=ic('out');$('#gCam').innerHTML=ic('cam');$('#gImg').innerHTML=ic('img');$('#oX').innerHTML=ic('x');$('#oS').innerHTML=ic('up');$('#oC').innerHTML=ic('copy');
$('#bMir').innerHTML=ic('mir');$('#bMir').onclick=()=>{S.o.flip=S.o.flip?0:1;$('#bMir').classList.toggle('on',!!S.o.flip);saveS();if(tab==='out')view()};$('#gCam').onclick=start;$('#bFlip').onclick=()=>{S.facing=S.facing==='environment'?'user':'environment';start()};
$('#bFmt').onclick=()=>{tab='out';view();snap(true)};
function toast(t,ms=900){const e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;top:30%;left:50%;transform:translateX(-50%);background:#000b;color:#fff;padding:8px 18px;border-radius:20px;z-index:20;font-size:13px';document.body.append(e);setTimeout(()=>e.remove(),ms)}
/* ---- capture: sensor-resolution photo, graded at full size ---- */
let blobRes=null,txtRes='';
async function sensorSource(){
  if(!S.o.sensor||!S.track||!window.ImageCapture)return null;
  try{const ic=new ImageCapture(S.track),pc=await ic.getPhotoCapabilities(),st={};
    if(pc.imageWidth&&pc.imageHeight){st.imageWidth=pc.imageWidth.max;st.imageHeight=pc.imageHeight.max}
    const bmp=await createImageBitmap(await ic.takePhoto(st));
    const k=Math.min(1,MT/Math.max(bmp.width,bmp.height),Math.sqrt(16e6/(bmp.width*bmp.height))),c=document.createElement('canvas');
    c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c;
  }catch(e){return null}
}
const done=(b,info)=>{blobRes=b;$('#res').src=URL.createObjectURL(b);$('#oT').textContent=`${info}  ${(b.size/1048576).toFixed(1)} MB`;$('#oC').style.display=S.mode==='ascii'?'grid':'none';$('#ov').style.display='flex';P.shots++;P.xp+=10;saveP()};
$('#sh').onclick=async()=>{
  if(!S.src)return;
  for(let i=S.o.timer;i>0;i--){toast(i,950);await new Promise(r=>setTimeout(r,1000))}
  const src=(await sensorSource())||S.src,[w0,h0]=sz(src);
  const k=Math.min(S.o.scale,MT/Math.max(w0,h0),Math.sqrt(16e6/(w0*h0)));
  draw(true,src,k);
  const type='image/'+S.o.fmt,q=S.o.q;
  if(S.mode==='ascii'){
    txtRes=asciiText();const L=txtRes.split('\n').filter(Boolean),fs=Math.max(10,Math.round(2400/S.m.cols/.6)),c=document.createElement('canvas'),x=c.getContext('2d'),f=fs+'px ui-monospace,Menlo,monospace';
    x.font=f;const cw=x.measureText('M').width;c.width=Math.round(cw*S.m.cols);c.height=Math.round(cw*2*L.length);x.font=f;x.textBaseline='top';
    x.fillStyle=S.m.inv?'#fff':'#000';x.fillRect(0,0,c.width,c.height);x.fillStyle=S.m.inv?'#000':'#fff';L.forEach((l,i)=>x.fillText(l,0,i*cw*2));
    c.toBlob(b=>done(b,`${c.width}×${c.height} ASCII`),type,q);
  }else cv.toBlob(b=>done(b,`${cv.width}×${cv.height} ${S.o.fmt.toUpperCase()}`),type,q);
};
$('#oX').onclick=()=>$('#ov').style.display='none';
$('#oC').onclick=async()=>{try{await navigator.clipboard.writeText(txtRes);toast('Copied')}catch(e){toast('Copy blocked')}};
$('#oS').onclick=async()=>{try{await navigator.share({files:[new File([blobRes],`deed_${Date.now()}.${S.o.fmt==='jpeg'?'jpg':S.o.fmt}`,{type:blobRes.type})]})}catch(e){toast('Long-press image to save',1500)}};
/* ---- pull-down panel ---- */
const pan=$('#pan');let cur=-1e4,base=0,sy=0,drag=false,tab='film';
const H=()=>pan.offsetHeight;
function setY(v){cur=Math.max(-H(),Math.min(0,v));pan.style.transform=`translateY(${cur}px)`}
function snap(open){pan.classList.add('sn');setY(open?0:-H());setTimeout(()=>pan.classList.remove('sn'),350)}
[$('#grab'),$('#grab2')].forEach(g=>{
  g.addEventListener('pointerdown',e=>{drag=true;sy=e.clientY;base=cur;g.setPointerCapture(e.pointerId)});
  g.addEventListener('pointermove',e=>{if(drag)setY(base+e.clientY-sy)});
  g.addEventListener('pointerup',e=>{drag=false;snap(Math.abs(e.clientY-sy)<6?cur<-H()/2:cur>-H()/2)});
});
setY(-H());addEventListener('resize',()=>{if(cur<-H()+2)setY(-H())});
/* ---- tabs ---- */
const TABS=[['film','film'],['lab','lab'],['sl','sl'],['out','out'],['clock','clock'],['book','book'],['award','award']];
const fv=(v,st)=>st>=1?(+v).toFixed(0):(+v).toFixed(2);
const sld=(a,key,l,mn,mx,st,src)=>`<div class="sl"><span>${l}</span><input type="range" min="${mn}" max="${mx}" step="${st}" value="${src[key]}" data-${a}="${key}" data-st="${st}"><b>${fv(src[key],st)}</b></div>`;
const chips=(arr,on,f)=>`<div class="row">${arr.map((x,i)=>`<div class="chip ${on(i)?'on':''}" data-f="${f}" data-i="${i}">${x.c?`<span class="sw" style="background:${x.c}"></span>`:x.ic?ic(x.ic):''}${x.n}</div>`).join('')}</div>`;
function view(){
  $('#tabs').innerHTML=TABS.map(t=>`<button class="b ${tab===t[0]?'on':''}" data-t="${t[0]}">${ic(t[1])}</button>`).join('');
  const pc=$('#pc'),c=caps();
  if(tab==='film')pc.innerHTML=`<div class="lb">Film simulation</div>`+chips(FILMS,i=>FILMS[i]===S.f,'film')+`<div class="sec"><div class="lb">My looks</div><button class="btn g" id="svp">${ic('plus')}</button></div><div class="row">${S.presets.length?S.presets.map((p,i)=>`<div class="chip r" data-f="pre" data-i="${i}">${p.n}<span class="x" data-del="${i}">${ic('x')}</span></div>`).join(''):'<span style="color:var(--dim)">Tune any setting, then save it here.</span>'}</div>`;
  if(tab==='lab'){
    const M=S.mode,m=S.m;
    let ex='';
    if(M==='pixel')ex=sld('m','cells','Cells across',8,400,1,m);
    if(M==='thr')ex=sld('m','thr','Threshold',.05,.95,.01,m);
    if(M==='dither')ex=sld('m','lv','Levels / channel',2,16,1,m);
    if(M==='post')ex=sld('m','lv','Levels / channel',2,16,1,m);
    if(M==='ascii')ex=sld('m','cols','Columns',30,220,1,m)+`<div class="lb">Character set</div>`+chips(CSN.map((n,i)=>({n:n+' '+CS[i].trim().slice(0,5)})),i=>m.cs===i,'cs')+`<div class="row" style="margin-top:10px"><div class="chip r ${m.inv?'on':''}" data-f="inv">Invert</div></div>`;
    pc.innerHTML=`<div class="lb">Algorithm</div>`+chips(MODES.map(a=>({n:a[1],ic:a[2]})),i=>MODES[i][0]===M,'mode')+(ex?`<div class="lb">Parameters</div>${ex}`:'')+`<div class="lb">Overlays</div><div class="row"><div class="chip r ${S.hist?'on':''}" data-f="hist">Histogram</div><div class="chip r ${S.grid?'on':''}" data-f="grid">Thirds</div></div>`;
  }
  if(tab==='sl'){
    const hw=['zoom','iso','exposureTime','focusDistance','exposureCompensation','colorTemperature'].filter(k=>c[k]&&c[k].max!==undefined);
    pc.innerHTML=SL.map(([t,a])=>`<div class="lb">${t}</div>`+a.map(r=>sld('p',...[r[0],r[1],r[2],r[3],r[4]],S.p)).join('')).join('')+`<div class="row" style="margin-top:12px"><button class="btn g" id="rst">Reset to film</button></div><div class="lb">Sensor</div>`+(hw.length?hw.map(k=>`<div class="sl"><span>${k}</span><input type="range" min="${c[k].min}" max="${c[k].max}" step="${c[k].step||(c[k].max-c[k].min)/100}" data-h="${k}"></div>`).join(''):`<div style="color:var(--dim)">This browser exposes no manual sensor controls. A native build adds ISO, shutter and focus.</div>`);
  }
  if(tab==='out'){
    const [w,h]=S.src?sz(S.src):[0,0],ic2=c.width&&c.width.max?`${c.width.max}×${c.height.max}`:'';
    pc.innerHTML=`<div class="lb">Format</div>`+chips(['JPEG','PNG','WEBP'].map(n=>({n})),i=>S.o.fmt===['jpeg','png','webp'][i],'fmt')+(S.o.fmt!=='png'?`<div class="lb">Compression quality</div>`+sld('o','q','Quality',.5,1,.01,S.o):'')+`<div class="lb">Resolution</div>`+chips([['Max',1],['75%',.75],['50%',.5],['25%',.25]].map(a=>({n:a[0]})),i=>S.o.scale===[1,.75,.5,.25][i],'scale')+`<div class="lb">Capture</div><div class="row"><div class="chip r ${S.o.sensor?'on':''}" data-f="sensor">Full sensor photo</div><div class="chip r ${S.o.flip?'on':''}" data-f="flip">Mirror image</div>${[0,3,10].map(s=>`<div class="chip r ${S.o.timer===s?'on':''}" data-f="timer" data-i="${s}">${s?s+' s timer':'No timer'}</div>`).join('')}</div><p style="color:var(--dim);font-size:12px">Preview stream ${w}×${h}${ic2?` · sensor up to ${ic2}`:''}. Output is graded at full size, capped at 16 MP by the browser canvas.</p>`;
  }
  if(tab==='clock')pc.innerHTML=HIST.map((h,i)=>`<div class="node" data-n="${i}"><div><div class="yr">${h[0]}</div><b>${h[1]}</b><p>${h[2]}</p></div></div>`).join('');
  if(tab==='book')pc.innerHTML=`<div class="card"><div class="lb" style="margin-top:0">Quiz</div><button class="btn" id="qz">Start</button></div><div class="card"><div class="lb" style="margin-top:0">Demosaic challenge</div><button class="btn" id="bz">Start</button></div><div id="game"></div><div class="lb">Light spectrum</div><div style="display:flex;height:70px;border-radius:12px;overflow:hidden">${['#7d3cff','#2b50ff','#1fd1a0','#e6e61f','#ff9f1c','#e0281c'].map(c=>`<i style="flex:1;background:${c}"></i>`).join('')}</div><div style="display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-top:4px"><span>380 nm</span><span>700 nm</span></div>`;
  if(tab==='award'){const lv=Math.floor(P.xp/100)+1,Q=[['First Exposure',P.shots>=1,'cam'],['Darkroom',P.films.length>=3,'film'],['Coder',P.algos.length>=3,'lab'],['Historian',P.lessons.length>=5,'book'],['Quizzer',P.quiz>=1,'award'],['Demosaicer',P.bayer>=1,'lab']];
    pc.innerHTML=`<div style="display:flex;align-items:center;gap:16px"><div class="big">${lv}</div><div style="flex:1"><div class="bar"><i style="width:${P.xp%100}%"></i></div><div style="color:var(--dim);margin-top:4px">${P.xp} XP</div></div></div><div class="row" style="margin-top:20px">${Q.map(q=>`<div class="bd ${q[1]?'on':''}">${ic(q[2])}${q[0]}</div>`).join('')}</div>`}
}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;view()}};
$('#pc').addEventListener('click',e=>{
  const d=e.target.closest('[data-del]');
  if(d){S.presets.splice(+d.dataset.del,1);saveS();view();return}
  const c=e.target.closest('[data-f]'),n=e.target.closest('.node'),g=e.target.closest('button')?.id;
  if(c){const f=c.dataset.f,i=+c.dataset.i;
    if(f==='film'){applyFilm(FILMS[i]);award('films',i)}
    if(f==='pre'){const p=S.presets[i];S.f=FILMS[p.f]||FILMS[0];S.p=JSON.parse(JSON.stringify(p.p));S.m={...S.m,...p.m};S.mode=p.mode}
    if(f==='mode'){S.mode=MODES[i][0];if(S.mode!=='off')award('algos',S.mode)}
    if(f==='cs')S.m.cs=i;if(f==='inv')S.m.inv=S.m.inv?0:1;
    if(f==='hist'){S.hist=!S.hist;award('algos','hist')}if(f==='grid')S.grid=!S.grid;
    if(f==='fmt')S.o.fmt=['jpeg','png','webp'][i];if(f==='scale')S.o.scale=[1,.75,.5,.25][i];
    if(f==='sensor')S.o.sensor=!S.o.sensor;if(f==='flip'){S.o.flip=S.o.flip?0:1;$('#bMir').classList.toggle('on',!!S.o.flip)}if(f==='timer')S.o.timer=i;
    applyUI();saveS();view()}
  if(n){n.classList.toggle('o');award('lessons',n.dataset.n)}
  if(g==='svp'){S.presets.push({n:'Look '+(S.presets.length+1),f:FILMS.indexOf(S.f),p:JSON.parse(JSON.stringify(S.p)),m:{...S.m},mode:S.mode});saveS();view();toast('Saved')}
  if(g==='rst'){applyFilm(S.f);saveS();view()}
  if(g==='qz')quiz();if(g==='bz')bayer();
});
$('#pc').addEventListener('input',e=>{const t=e.target,v=+t.value,tg=t.dataset;
  if(tg.p)S.p[tg.p]=v;if(tg.m)S.m[tg.m]=v;if(tg.o)S.o[tg.o]=v;if(tg.h)setHw(tg.h,v);
  if(tg.st)t.nextElementSibling.textContent=fv(v,+tg.st);applyUI();saveS()});
/* ---- games ---- */
function quiz(){const q=[...QZ].sort(()=>Math.random()-.5).slice(0,5);let i=0,sc=0;const g=$('#game');
  const show=()=>{if(i>=q.length){P.quiz++;P.xp+=sc*8;saveP();g.innerHTML=`<div class="card"><div class="big">${sc}/${q.length}</div><p style="color:var(--dim)">+${sc*8} XP</p></div>`;return}
    const it=q[i];g.innerHTML=`<div class="card"><b>${it[0]}</b>${it[1].map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>`;
    g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;b.classList.add(k===it[2]?'ok':'no');if(k===it[2])sc++;else g.querySelectorAll('.opt')[it[2]].classList.add('ok');g.querySelectorAll('.opt').forEach(x=>x.onclick=null);setTimeout(()=>{i++;show()},900)})};
  show();g.scrollIntoView({behavior:'smooth'})}
function bayer(){let r=0,sc=0;const g=$('#game');
  const next=()=>{if(r>=5){P.bayer++;P.xp+=sc*10;saveP();g.innerHTML=`<div class="card"><div class="big">${sc}/5</div><p style="color:var(--dim)">+${sc*10} XP</p></div>`;return}
    const n=[0,0,0,0].map(()=>20+Math.floor(Math.random()*200)),ans=Math.round(n.reduce((a,b)=>a+b)/4);
    const o=[ans,ans+18,ans-22,Math.max(...n)].filter((v,i,a)=>a.indexOf(v)===i).sort(()=>Math.random()-.5);
    const cell=v=>`<div style="background:rgb(20,${v},40)">${v}</div>`,e='<div style="background:var(--s2)"></div>';
    g.innerHTML=`<div class="card"><b>Missing green value (bilinear demosaic)</b><div class="mos">${e}${cell(n[0])}${e}${cell(n[1])}<div style="background:var(--s2);border:2px dashed var(--ac)">?</div>${cell(n[2])}${e}${cell(n[3])}${e}</div>${o.map(v=>`<button class="opt" data-v="${v}">${v}</button>`).join('')}</div>`;
    g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.v===ans;b.classList.add(ok?'ok':'no');if(ok)sc++;g.querySelectorAll('.opt').forEach(x=>{x.onclick=null;if(+x.dataset.v===ans)x.classList.add('ok')});setTimeout(()=>{r++;next()},1000)})};
  next();g.scrollIntoView({behavior:'smooth'})}
applyFilm(S.f);try{const z=JSON.parse(localStorage.getItem('deed_state')||'null');if(z)Object.assign(S.p,z.p)}catch(e){}
